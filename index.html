<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .modal {
            transition: opacity 0.25s ease;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        .attachment-link {
            color: #3b82f6;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Login Page -->
    <div id="loginPage" class="flex justify-center items-center h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <h1 class="text-2xl font-bold text-center mb-8 text-gray-800">Task Management System</h1>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email</label>
                    <input type="email" id="email" required class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Enter your email">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                    <input type="password" id="password" required class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Enter your password">
                </div>
                <div>
                    <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded focus:outline-none focus:shadow-outline">
                        Login
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Main Application (hidden until login) -->
    <div id="appContent" class="container mx-auto px-4 py-8 hidden">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div class="flex items-center">
                <h1 class="text-2xl font-bold text-gray-800">Task Management System</h1>
                <span id="userEmail" class="ml-4 bg-blue-100 text-blue-800 text-sm py-1 px-3 rounded-full"></span>
            </div>
            <div class="flex gap-4">
                <button onclick="toggleModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center">
                    <i class="bi bi-plus-lg mr-2"></i> Add Task
                </button>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg flex items-center">
                    <i class="bi bi-box-arrow-right mr-2"></i> Logout
                </button>
            </div>
        </div>

        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div onclick="filterTasks('all')" class="bg-white p-4 rounded-lg shadow cursor-pointer hover:shadow-md transition-shadow">
                <div class="flex items-center justify-between">
                    <h3 class="text-gray-500">Total Tasks</h3>
                    <i class="bi bi-list-task text-gray-500 text-xl"></i>
                </div>
                <p class="text-2xl font-bold" id="totalTasks">0</p>
            </div>
            <div onclick="filterTasks('pending')" class="bg-yellow-50 p-4 rounded-lg shadow cursor-pointer hover:shadow-md transition-shadow">
                <div class="flex items-center justify-between">
                    <h3 class="text-yellow-500">Pending Tasks</h3>
                    <i class="bi bi-hourglass-split text-yellow-500 text-xl"></i>
                </div>
                <p class="text-2xl font-bold" id="pendingTasks">0</p>
            </div>
            <div onclick="filterTasks('inProgress')" class="bg-blue-50 p-4 rounded-lg shadow cursor-pointer hover:shadow-md transition-shadow">
                <div class="flex items-center justify-between">
                    <h3 class="text-blue-500">In Progress</h3>
                    <i class="bi bi-arrow-repeat text-blue-500 text-xl"></i>
                </div>
                <p class="text-2xl font-bold" id="inProgressTasks">0</p>
            </div>
            <div onclick="filterTasks('done')" class="bg-green-50 p-4 rounded-lg shadow cursor-pointer hover:shadow-md transition-shadow">
                <div class="flex items-center justify-between">
                    <h3 class="text-green-500">Completed Tasks</h3>
                    <i class="bi bi-check-circle text-green-500 text-xl"></i>
                </div>
                <p class="text-2xl font-bold" id="completedTasks">0</p>
            </div>
        </div>

        <!-- Current Filter Label -->
        <div class="mb-4">
            <h3 class="text-lg font-medium text-gray-700">
                <span id="currentFilterLabel">All Tasks</span>
                <small id="filterCount" class="text-gray-500 ml-2">(0)</small>
            </h3>
        </div>

        <!-- Tasks List -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Tasks</h2>
            <div id="tasksList" class="space-y-4">
                <div class="text-center text-gray-500">No tasks found.</div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-black opacity-50" onclick="toggleModal()"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-lg shadow-lg z-50 overflow-y-auto">
            <div class="modal-content py-4 text-left px-6">
                <div class="flex justify-between items-center pb-3">
                    <p class="text-2xl font-bold">Add New Task</p>
                    <button onclick="toggleModal()" class="text-black hover:text-gray-700">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <form id="taskForm" onsubmit="addTask(event)">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Task Description</label>
                        <textarea required name="description" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" rows="3"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Attachment</label>
                        <input type="file" name="attachment" id="attachment" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Target Date</label>
                        <input required type="date" name="targetDate" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                    <div class="flex justify-end">
                        <button type="button" onclick="toggleModal()" class="mr-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                            Cancel
                        </button>
                        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                            Add Task
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Attachment Preview Modal -->
    <div id="attachmentModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-black opacity-50" onclick="toggleAttachmentModal()"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-xl mx-auto rounded-lg shadow-lg z-50 overflow-y-auto">
            <div class="modal-content py-4 text-left px-6">
                <div class="flex justify-between items-center pb-3">
                    <p class="text-xl font-bold" id="attachmentName">Attachment</p>
                    <button onclick="toggleAttachmentModal()" class="text-black hover:text-gray-700">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                <div id="attachmentPreview" class="py-4 flex justify-center">
                    <!-- Attachment preview content will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // User authentication
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        
        // Check login status
        function checkLogin() {
            const loginPage = document.getElementById('loginPage');
            const appContent = document.getElementById('appContent');
            
            if (currentUser) {
                loginPage.classList.add('hidden');
                appContent.classList.remove('hidden');
                document.getElementById('userEmail').textContent = currentUser.email;
                loadUserTasks();
            } else {
                loginPage.classList.remove('hidden');
                appContent.classList.add('hidden');
            }
        }
        
        // Handle login
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Simple authentication (in real apps, use secure authentication)
            currentUser = { email };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            checkLogin();
            document.getElementById('loginForm').reset();
        }
        
        // Logout function
        function logout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            checkLogin();
        }
        
        // Tasks management
        let tasks = [];
        let currentFilter = 'all';
        
        // Load user tasks
        function loadUserTasks() {
            if (!currentUser) return;
            
            const storedTasks = JSON.parse(localStorage.getItem(`tasks_${currentUser.email}`)) || [];
            tasks = storedTasks;
            renderTasks();
        }
        
        // Save tasks
        function saveTasks() {
            if (!currentUser) return;
            localStorage.setItem(`tasks_${currentUser.email}`, JSON.stringify(tasks));
        }

        // Toggle modal
        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
        }
        
        // Toggle attachment modal
        function toggleAttachmentModal(attachment = null) {
            const modal = document.getElementById('attachmentModal');
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            
            if (attachment) {
                const previewContainer = document.getElementById('attachmentPreview');
                const attachmentName = document.getElementById('attachmentName');
                
                attachmentName.textContent = attachment.name;
                
                // Clear previous content
                previewContainer.innerHTML = '';
                
                // Check file type and display accordingly
                if (attachment.type && attachment.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = attachment.url || URL.createObjectURL(attachment.file);
                    img.classList.add('max-h-96', 'max-w-full');
                    previewContainer.appendChild(img);
                } else {
                    // For non-image files, just show the filename
                    const fileInfo = document.createElement('div');
                    fileInfo.innerHTML = `
                        <div class="flex items-center justify-center text-center p-8">
                            <div>
                                <i class="bi bi-file-earmark text-gray-500 text-6xl"></i>
                                <p class="mt-4 text-lg">${attachment.name}</p>
                                <p class="text-gray-500 text-sm">${attachment.type || 'File'}</p>
                            </div>
                        </div>
                    `;
                    previewContainer.appendChild(fileInfo);
                }
            }
        }

        // Update dashboard stats
        function updateDashboardStats() {
            document.getElementById('totalTasks').textContent = tasks.length;
            document.getElementById('pendingTasks').textContent = tasks.filter(t => t.status === 'pending').length;
            document.getElementById('inProgressTasks').textContent = tasks.filter(t => t.status === 'inProgress').length;
            document.getElementById('completedTasks').textContent = tasks.filter(t => t.status === 'done').length;
            
            // Update filter count
            const filterCount = document.getElementById('filterCount');
            
            if (currentFilter === 'all') {
                filterCount.textContent = `(${tasks.length})`;
            } else {
                const filteredCount = tasks.filter(task => task.status === currentFilter).length;
                filterCount.textContent = `(${filteredCount})`;
            }
        }

        // Add task
        function addTask(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const description = formData.get('description');
            const targetDate = formData.get('targetDate');
            const attachmentFile = document.getElementById('attachment').files[0];
            
            const newTask = {
                id: Date.now(),
                description: description,
                targetDate: targetDate,
                status: 'pending',
                attachment: attachmentFile ? {
                    name: attachmentFile.name,
                    type: attachmentFile.type,
                    file: attachmentFile,
                    url: URL.createObjectURL(attachmentFile)
                } : null
            };
            
            tasks.push(newTask);
            saveTasks();
            renderTasks();
            toggleModal();
            event.target.reset();
        }

        // Update task status
        function updateTaskStatus(taskId, newStatus) {
            tasks = tasks.map(task => 
                task.id === taskId ? {...task, status: newStatus} : task
            );
            saveTasks();
            renderTasks();
        }

        // Filter tasks
        function filterTasks(status) {
            currentFilter = status;
            
            // Update filter label
            const filterLabels = {
                'all': 'All Tasks',
                'pending': 'Pending Tasks',
                'inProgress': 'In Progress Tasks',
                'done': 'Completed Tasks',
                'rework': 'Tasks Needing Rework'
            };
            
            document.getElementById('currentFilterLabel').textContent = filterLabels[status] || 'Tasks';
            
            renderTasks();
        }

        // View attachment
        function viewAttachment(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task && task.attachment) {
                toggleAttachmentModal(task.attachment);
            }
        }

        // Render tasks
        function renderTasks() {
            const tasksList = document.getElementById('tasksList');
            let filteredTasks = tasks;
            
            if (currentFilter !== 'all') {
                filteredTasks = tasks.filter(task => task.status === currentFilter);
            }

            if (filteredTasks.length === 0) {
                tasksList.innerHTML = '<div class="text-center text-gray-500">No tasks found.</div>';
            } else {
                tasksList.innerHTML = filteredTasks.map(task => `
                    <div class="border rounded-lg p-4 ${
                        task.status === 'done' ? 'bg-green-50' :
                        task.status === 'inProgress' ? 'bg-blue-50' :
                        task.status === 'rework' ? 'bg-red-50' :
                        task.status === 'pending' ? 'bg-yellow-50' : ''
                    }">
                        <div class="flex flex-col md:flex-row justify-between items-start gap-4">
                            <div class="flex-1">
                                <p class="font-medium mb-2">${task.description}</p>
                                <p class="text-sm text-gray-500">Due: ${new Date(task.targetDate).toLocaleDateString()}</p>
                                ${task.attachment ? 
                                    `<p class="text-sm mt-2">
                                        <span class="attachment-link" onclick="viewAttachment(${task.id})">
                                            <i class="bi bi-paperclip"></i> ${task.attachment.name}
                                        </span>
                                    </p>` : ''}
                            </div>
                            <div class="w-full md:w-auto">
                                <select 
                                    onchange="updateTaskStatus(${task.id}, this.value)"
                                    class="w-full md:w-auto px-3 py-2 rounded border bg-white"
                                >
                                    <option value="pending" ${task.status === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="inProgress" ${task.status === 'inProgress' ? 'selected' : ''}>In Progress</option>
                                    <option value="done" ${task.status === 'done' ? 'selected' : ''}>Done</option>
                                    <option value="rework" ${task.status === 'rework' ? 'selected' : ''}>Re-Work</option>
                                </select>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            updateDashboardStats();
        }

        // Initialize app
        checkLogin();
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
